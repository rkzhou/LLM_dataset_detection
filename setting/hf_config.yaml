dataset_alias: dd15k

general_dataset_path: "../datasets/partition/general/{dataset_alias}_subset_0.pkl"
selected_index_path: "../datasets/IID/selection/{dataset_alias}_BERT.pkl"
model_template: 4
model_name: ikala/bloom-zh-3b-chat
model_action: train
continue_train: False
seed_index: 42

model_checkpoint: "checkpoint-final"
model_output_dir: "../models/local/IID/{model_name}/{dataset_alias}"
prediction_dir: "../answers/local/IID/{model_name}/{dataset_alias}"

r: 8
lora_alpha: 32
lora_dropout: 0.05
bias: "none"
task_type: "CAUSAL_LM"
per_device_train_batch_size: 8
optim: "paged_adamw_8bit"
num_train_epochs: 3.0
save_strategy: "epoch"
logging_steps: 500
learning_rate: 1e-4

inference_batch_size: 4
inference_times: 3
do_sample: True
temperature: 1.0
